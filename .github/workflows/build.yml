# Builds the Linux node binary on every push to main and uploads it as a
# workflow artifact, for deployment to our servers.
#
# Replaces upstream's workflows, which run Autonomi's test matrix, PR checks
# and signed multi-platform releases.

name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    # Pinned to the servers' Ubuntu release: a binary built against a newer
    # glibc will not run on an older one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --bin ant-node

      - name: Package
        run: |
          mkdir dist
          cp target/release/ant-node config/bootstrap_peers.toml dist/
          tar -C dist -czf ant-node-linux-x64.tar.gz .
          sha256sum ant-node-linux-x64.tar.gz > SHA256SUMS.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ant-node-linux-x64
          path: |
            ant-node-linux-x64.tar.gz
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  # Packages the binary as the Docker image home operators run, pushes it to
  # GitHub's container registry (private, like this repo), and checks that a
  # container starts, joins the network and stops cleanly.
  image:
    needs: linux-x64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/project-dspace/storage-node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ant-node-linux-x64

      - name: Unpack build
        run: mkdir dist && tar -xzf ant-node-linux-x64.tar.gz -C dist

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # One node with a 2 GB storage limit, re-measured every 20 seconds instead
      # of every 6 hours. Filling 6 GB of the same disk outside the node's folder
      # must make the container re-apply the limit and restart the node.
      - name: Smoke test
        run: |
          docker run -d --name smoke --network host \
            -e REWARDS_ADDRESS=0x3543E4c2F83447bB7220C08453b3611b7513D52C \
            -e NODE_COUNT=1 -e PORT_START=10900 \
            -e STORAGE_LIMIT_GB=2 -e STORAGE_RECHECK_SECONDS=20 \
            -v "$PWD/smoke-data:/data" "$IMAGE:${{ github.sha }}"
          joined='Successfully connected to [1-9]'
          count() { docker logs smoke 2>&1 | grep -cE "$1" || true; }
          wait_for() { for _ in $(seq 1 90); do [ "$(count "$1")" -ge "${2:-1}" ] && return 0; sleep 2; done; return 1; }
          reserve() { docker exec smoke sed -n 's/^disk_reserve_mb = //p' /tmp/storage.toml; }
          fail() { echo "FAILED: $1"; docker logs smoke 2>&1 | grep -vE '^\s*$' | tail -40; exit 1; }

          wait_for "$joined" || fail "the node did not join the network"
          [ "$(count 'Storage limit: 2 GB for all nodes together')" -ge 1 ] || fail "no storage limit message"
          first=$(reserve)
          [ "$first" -gt 500 ] || fail "reserve $first MiB was not raised for the limit"

          fallocate -l 6G "$PWD/filler"
          wait_for 'restarting them one at a time' || fail "the limit was not re-applied after the disk filled"
          joins=$(count "$joined")
          wait_for "$joined" $(( joins + 1 )) || fail "the node did not rejoin after its restart"
          rm "$PWD/filler"
          second=$(reserve)
          [ $(( first - second )) -gt 5000 ] || fail "reserve went from $first to $second MiB"
          echo "reserve: $first MiB, then $second MiB after filling 6 GB; node restarted and rejoined"

          docker logs smoke 2>&1 | grep -vE '^\s*$' | grep -v 'saorsa' | head -15
          start=$(date +%s); docker stop -t 30 smoke >/dev/null
          echo "stopped in $(( $(date +%s) - start ))s"

      - name: Publish
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
