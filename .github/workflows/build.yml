# Builds the Linux node binary on every push to main and uploads it as a
# workflow artifact, for deployment to our servers.
#
# Replaces upstream's workflows, which run Autonomi's test matrix, PR checks
# and signed multi-platform releases.

name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same branch replaces an older one, so an older build
# can never publish after a newer one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    # Pinned to the servers' Ubuntu release: a binary built against a newer
    # glibc will not run on an older one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --bin ant-node

      - name: Package
        run: |
          mkdir dist
          cp target/release/ant-node config/bootstrap_peers.toml dist/
          tar -C dist -czf ant-node-linux-x64.tar.gz .
          sha256sum ant-node-linux-x64.tar.gz > SHA256SUMS.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ant-node-linux-x64
          path: |
            ant-node-linux-x64.tar.gz
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  # Packages the binary as the Docker image home operators run, pushes it to
  # GitHub's container registry (private, like this repo), and checks that a
  # container starts, joins the network and stops cleanly.
  image:
    needs: linux-x64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/project-dspace/storage-node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ant-node-linux-x64

      - name: Unpack build
        run: mkdir dist && tar -xzf ant-node-linux-x64.tar.gz -C dist

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # Runs the image on a small isolated network (never the live one):
      # joining, browser addresses, restarts, taking over the previous image's
      # layout, retiring nodes, clean stops and disk-pressure eviction.
      - name: Smoke test
        run: bash docker/smoke-test.sh "$IMAGE:${{ github.sha }}"

      # The image as a file, for loading onto our servers without registry
      # credentials (docker load).
      - name: Save image
        run: docker save "$IMAGE:${{ github.sha }}" | gzip > storage-node-image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: storage-node-image
          path: storage-node-image.tar.gz
          retention-days: 30

      - name: Publish
        run: docker push "$IMAGE:${{ github.sha }}"

      # Only main moves :latest, which home operators update from.
      - name: Publish as latest
        if: github.ref == 'refs/heads/main'
        run: docker push "$IMAGE:latest"
